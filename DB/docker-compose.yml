# docker-compose.yml
version: "3.8"

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expenses-mysql-container
    # restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1
      MYSQL_DATABASE: expenses
    ports:
      - "3306:3306"
    # volumes:
    #   - mysql-data:/var/lib/mysql
    networks:
      - mysql-network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local

networks:
  mysql-network:
    driver: bridge
